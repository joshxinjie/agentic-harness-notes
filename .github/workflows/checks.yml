name: Checks

# Links and anchors must resolve, and the review harness tests must pass, on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Links and anchors
        run: python3 tools/check_links.py .
      - name: Review harness tests
        run: PYTHONPATH=scripts python -m pytest -q tests
